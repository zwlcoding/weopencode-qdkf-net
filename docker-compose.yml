version: '3.8'

services:
  wechat-bridge:
    build: .
    container_name: wechat-opencode-bridge
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-http://host.docker.internal:4096}
      - OPENCODE_USERNAME=${OPENCODE_USERNAME:-admin}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - WECHAT_CORP_ID=${WECHAT_CORP_ID}
      - WECHAT_TOKEN=${WECHAT_TOKEN}
      - WECHAT_ENCODING_AES_KEY=${WECHAT_ENCODING_AES_KEY}
      - PORT=3000
    restart: unless-stopped
    networks:
      - wechat-bridge

networks:
  wechat-bridge:
    driver: bridge